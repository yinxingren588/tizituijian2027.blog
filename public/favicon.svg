<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" />
  
  <!-- 梯子造型与闪电加速象征 -->
  <g filter="url(#glow)">
    <!-- 梯子左梁 -->
    <path d="M 22 14 L 18 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- 梯子右梁 -->
    <path d="M 42 14 L 46 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- 梯子横档 -->
    <path d="M 21 22 L 43 22" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 32 L 44 32" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <path d="M 19 42 L 45 42" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <!-- 顶部升腾火箭/火苗象征高速穿越 -->
    <polygon points="32,8 36,16 32,14 28,16" fill="#f59e0b" />
    <circle cx="32" cy="11" r="2" fill="#fbbf24" />
  </g>
</svg>
